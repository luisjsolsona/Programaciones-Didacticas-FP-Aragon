# =============================================================
# frontend/nginx.conf — Configuración de Nginx
#
# Dos bloques principales:
#   1. /api/  → proxy al backend Express (puerto 3001)
#   2. /      → sirve el HTML estático (SPA)
#
# Nginx actúa como punto de entrada único: el navegador solo
# habla con Nginx, nunca directamente con Express.
# =============================================================

# Protocolo original: si llega de Caddy (HTTPS) se respeta su X-Forwarded-Proto;
# en local (sin Caddy) se usa el de esta conexión.
map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    # Carpeta raíz donde está el index.html
    root /usr/share/nginx/html;
    index index.html;

    # ── Proxy hacia la API ─────────────────────────────────
    # Todas las peticiones a /api/* se redirigen al backend.
    # El nombre 'backend' es el nombre del servicio en docker-compose.
    location /api/ {
        client_max_body_size 20m;
        proxy_pass         http://backend:3001;
        proxy_http_version 1.1;

        # Cabeceras necesarias para que Express reciba la IP real
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $fwd_proto;

        # Timeouts generosos para operaciones largas (export Word/PDF)
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ── Ficheros estáticos ─────────────────────────────────
    # Sirve el HTML directamente.
    # Cualquier ruta que no sea /api/ devuelve el index.html
    # (necesario si en el futuro se añaden rutas en el frontend).
    location / {
        try_files $uri $uri/ /index.html;

        # Cache del HTML: no cachear para que siempre sea fresco
        add_header Cache-Control "no-cache, no-store, must-revalidate";

        # Cabeceras de seguridad (van aquí porque add_header en un location
        # anula las del bloque server)
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        # CSP: la app usa scripts/estilos en línea ('unsafe-inline'), pero se
        # restringen conexiones, objetos, marcos y destinos de formularios.
        # connect-src 'self': CATEDU se lee a través del backend (/api/catedu).
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
    }
}
